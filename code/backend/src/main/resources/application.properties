server.address=127.0.0.1
server.port=8080
spring.config.import=optional:file:./config/application-local.properties
spring.datasource.url=jdbc:sqlite:./data/campus.db?busy_timeout=5000&journal_mode=WAL
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
campus.admin-password=${ADMIN_PASSWORD:123456}
llm.base-url=${LLM_BASE_URL:https://ws-q3rjjrz12pav2w64.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
llm.model=${LLM_MODEL:qwen3.8-flash}
llm.api-key=${LLM_API_KEY:}
llm.timeout-seconds=60
embedding.base-url=${EMBEDDING_BASE_URL:}
embedding.model=${EMBEDDING_MODEL:}
embedding.api-key=${EMBEDDING_API_KEY:}
embedding.dimensions=${EMBEDDING_DIMENSIONS:0}
embedding.timeout-seconds=30
rag.top-k=5
# 必须结合实际 embedding 服务校准；空值时拒绝问答，不能把最高分直接当成命中。
rag.min-similarity=${RAG_MIN_SIMILARITY:}
spring.jackson.deserialization.accept-float-as-int=false
spring.http.client.factory=simple
